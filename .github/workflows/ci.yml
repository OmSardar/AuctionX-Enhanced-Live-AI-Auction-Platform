name: AuctionX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ============================================================================
  # Secret Scanning (Gitleaks Full History)
  # ============================================================================
  secret-scan:
    name: Secret Scanning (Gitleaks v8.30.1 Full History)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned Gitleaks Binary (v8.30.1)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks Full History Scan
        run: |
          gitleaks git --verbose --redact --exit-code 1

  # ============================================================================
  # Backend Tests (Node.js Express + MongoDB 7.0 + Redis 7)
  # ============================================================================
  backend:
    name: Backend CI (Unit, Smoke, Graybox, Acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Run Backend Unit Tests
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URL: mongodb://127.0.0.1:27017/auctionx-test
          JWT_SECRET: test-backend-ci-jwt-secret-minimum-32-chars-long
        run: npm run test:unit

      - name: Run Backend Smoke Tests
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URL: mongodb://127.0.0.1:27017/auctionx-test
          JWT_SECRET: test-backend-ci-jwt-secret-minimum-32-chars-long
        run: npm run test:smoke

      - name: Run Backend Graybox Tests
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URL: mongodb://127.0.0.1:27017/auctionx-test
          JWT_SECRET: test-backend-ci-jwt-secret-minimum-32-chars-long
        run: npm run test:graybox

      - name: Run Backend Acceptance Tests
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URL: mongodb://127.0.0.1:27017/auctionx-test
          JWT_SECRET: test-backend-ci-jwt-secret-minimum-32-chars-long
        run: npm run test:acceptance

      - name: Run Backend Integration & Settlement Tests
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URL: mongodb://127.0.0.1:27017/auctionx-test
          JWT_SECRET: test-backend-ci-jwt-secret-minimum-32-chars-long
        run: npx jest tests/integration/security/ tests/integration/stage5_end_to_end_settlement.test.js --runInBand --detectOpenHandles --forceExit

  # ============================================================================
  # Frontend Build & Asset Verification (React 18 / Vite 5)
  # ============================================================================
  frontend:
    name: Frontend CI (Build & Leak Check)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Run Client Unit & Regression Tests
        working-directory: client
        run: npm test

      - name: Validate Vite Production Build
        working-directory: client
        env:
          VITE_API_URL: https://api.auctionx.example.com
          VITE_RECOMMENDATION_API_URL: https://rec.auctionx.example.com
          VITE_RAZORPAY_API_KEY: rzp_test_placeholder_key
        run: npm run build

      - name: Verify No Sensitive Variables Leaked in Client Bundle
        run: |
          echo "Scanning client/dist for disallowed secret variable names..."
          if grep -rn "JWT_SECRET" client/dist/ 2>/dev/null; then
            echo "::error::JWT_SECRET found leaked into client bundle!"
            exit 1
          fi
          if grep -rn "RAZORPAY_KEY_SECRET" client/dist/ 2>/dev/null; then
            echo "::error::RAZORPAY_KEY_SECRET found leaked into client bundle!"
            exit 1
          fi
          if grep -rn "CLOUDINARY_API_SECRET" client/dist/ 2>/dev/null; then
            echo "::error::CLOUDINARY_API_SECRET found leaked into client bundle!"
            exit 1
          fi
          echo "Bundle security verification passed."

  # ============================================================================
  # Recommendation Service Tests (Python 3.10 FastAPI Microservice)
  # ============================================================================
  recommendation-service:
    name: Recommendation Service CI (Python 3.10 & CORS Regression)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: recommendation_service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r recommendation_service/requirements.txt pytest httpx

      - name: Start Live Recommendation Service Daemon
        working-directory: recommendation_service
        env:
          ENVIRONMENT: test
          PORT: 8000
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: auctionx-rec-test
          REDIS_URL: redis://127.0.0.1:6379
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > rec_service.log 2>&1 &
          echo "Waiting for recommendation service /health endpoint..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/health | grep -q "healthy"; then
              echo "Recommendation service started successfully on port 8000."
              break
            fi
            sleep 1
          done

      - name: Run Recommendation Service Unit & Endpoint Tests (pytest)
        working-directory: recommendation_service
        env:
          ENVIRONMENT: test
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: auctionx-rec-test
          REDIS_URL: redis://127.0.0.1:6379
        run: pytest tests/test_recommendations.py -v

      - name: Run CORS Regression & Endpoint Tests
        working-directory: recommendation_service
        run: python test_cors_regression.py

      - name: Output Service Logs on Failure
        if: failure()
        run: cat recommendation_service/rec_service.log

  # ============================================================================
  # Docker Compose & Architecture Validation
  # ============================================================================
  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose Development Configuration
        run: |
          export RECOMMENDATION_HMAC_SECRET="ci-test-validation-placeholder"
          export INTERNAL_SERVICE_KEY="ci-test-validation-placeholder"
          docker compose config -q

      - name: Validate Compose Production Configuration
        run: |
          export RECOMMENDATION_HMAC_SECRET="ci-test-validation-placeholder"
          export INTERNAL_SERVICE_KEY="ci-test-validation-placeholder"
          export REDIS_PASSWORD="$(printf '0%.0s' {1..64})"
          export JWT_SECRET="ci-test-validation-placeholder"
          docker compose -f compose.prod.yaml config -q

  # ============================================================================
  # E2E Playwright Browser Validation (Cross-Platform)
  # ============================================================================
  e2e:
    name: E2E Playwright Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client and Server Dependencies
        run: |
          cd client && npm ci
          cd ../server && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright Chromium Browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E Test Suite
        working-directory: e2e
        env:
          CI: "true"
          PORT: 5000
          NODE_ENV: test
          MONGODB_URL: mongodb://127.0.0.1:27017/auctionx-e2e
          JWT_SECRET: test-e2e-jwt-secret-minimum-32-chars-long
          VITE_API_URL: http://localhost:5000
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
        run: npm test

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
