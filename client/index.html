<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuctionX — AI-Powered Live Auction Platform</title>
    <meta
      name="description"
      content="An ambitious full-stack demonstration project featuring real-time bidding, payment workflows, seller and buyer experiences, and AI-powered recommendations, built with production-oriented engineering practices."
    />

    <!-- Icons and Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#D97A56" />
    <meta name="msapplication-TileColor" content="#1A1512" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="theme-color" content="#1A1512" />

    <!-- Apple Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AuctionX" />

    <!-- Android Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AuctionX" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:site_name" content="AuctionX" />
    <meta property="og:title" content="AuctionX — AI-Powered Live Auction Platform" />
    <meta
      property="og:description"
      content="An ambitious full-stack demonstration project featuring real-time bidding, payment workflows, seller and buyer experiences, and AI-powered recommendations, built with production-oriented engineering practices."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuctionX — AI-Powered Live Auction Platform" />
    <meta
      name="twitter:description"
      content="An ambitious full-stack demonstration project featuring real-time bidding, payment workflows, seller and buyer experiences, and AI-powered recommendations, built with production-oriented engineering practices."
    />
    <meta name="twitter:image" content="/twitter-image.png" />

    <!-- Google Fonts: Inter & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons (working version) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Dark Mode Toggle Script & Scroll Restoration Control -->
    <script>
      if (typeof window !== "undefined" && "scrollRestoration" in window.history) {
        window.history.scrollRestoration = "manual";
      }
      if (localStorage.theme === "dark") {
        document.querySelector("html").classList.add("dark");
        document.querySelector("html").style.colorScheme = "dark";
      } else {
        document.querySelector("html").classList.remove("dark");
        document.querySelector("html").style.colorScheme = "light";
      }
    </script>
  </head>

  <body
    class="font-sans antialiased bg-canvas text-foreground selection:bg-action-primary/20 selection:text-action-primary min-h-screen"
  >
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Sidebar State Script -->
    <script>
      if (localStorage.getItem("sidebar-expanded") == "true") {
        document.body.classList.add("sidebar-expanded");
      } else {
        document.body.classList.remove("sidebar-expanded");
      }
    </script>

    <!-- App Mount Point -->
    <div id="root"></div>

    <!-- Vite Main Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
