<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mainBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D3530"/>
      <stop offset="100%" stop-color="#24201D"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C25E38"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="320" height="380" rx="16" fill="url(#mainBg)"/>

  <!-- Header Section -->
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#C25E38" fill-opacity="0.2"/>
  <path d="M36 44 L44 36 L52 44" stroke="#C25E38" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Consignor Dashboard</text>
  <text x="76" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#A89B91">Live Sales &amp; Settlement</text>

  <!-- Metric Box -->
  <rect x="24" y="80" width="272" height="74" rx="12" fill="#2E2824" stroke="#4A3F37" stroke-width="1"/>
  <text x="40" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#A89B91">Total Consigned GMV</text>
  <text x="40" y="136" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF font-numeric">₹1,84,50,000</text>
  <rect x="200" y="100" width="80" height="24" rx="6" fill="#065F46"/>
  <text x="240" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34D399">+42% MoM</text>

  <!-- Chart Curve Visual -->
  <g transform="translate(24, 175)">
    <rect width="272" height="175" rx="12" fill="#2E2824" stroke="#4A3F37" stroke-width="1"/>
    <!-- Grid lines -->
    <line x1="20" y1="40" x2="252" y2="40" stroke="#3D3530" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="20" y1="80" x2="252" y2="80" stroke="#3D3530" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="20" y1="120" x2="252" y2="120" stroke="#3D3530" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Area under curve -->
    <path d="M20 130 Q70 110, 110 80 T200 50 T252 20 L252 140 L20 140 Z" fill="#C25E38" fill-opacity="0.15"/>
    <!-- Curve -->
    <path d="M20 130 Q70 110, 110 80 T200 50 T252 20" stroke="url(#chartLine)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="252" cy="20" r="5" fill="#D97706"/>
    <text x="20" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#8C7D73">Instant Settlement Rate: 99.4%</text>
  </g>
</svg>
