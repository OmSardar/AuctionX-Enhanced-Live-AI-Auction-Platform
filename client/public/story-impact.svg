    <circle cx="80" cy="140" r="20" fill="#D97706"/>
    <circle cx="220" cy="140" r="20" fill="#2563EB"/>
    <line x1="130" y1="95" x2="95" y2="125" stroke="#8C7D73" stroke-width="2.5" stroke-dasharray="4 4"/>
    <line x1="170" y1="95" x2="205" y2="125" stroke="#8C7D73" stroke-width="2.5" stroke-dasharray="4 4"/>
    <text x="150" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">IMPACT</text>
  </g>
