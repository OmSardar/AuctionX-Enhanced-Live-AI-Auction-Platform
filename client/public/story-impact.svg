<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFBF9"/>
      <stop offset="100%" stop-color="#F2EBE3"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#bgI)" stroke="#E5DDD3" stroke-width="2"/>
