<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="cricketBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#12302e"/>
      <stop offset="55%" stop-color="#081817"/>
      <stop offset="100%" stop-color="#030909"/>
    </radialGradient>
    <linearGradient id="warmLight" x1="50%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </linearGradient>

    <!-- Willow Wood Gradients -->
    <linearGradient id="willowWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="25%" stop-color="#faedcd"/>
      <stop offset="65%" stop-color="#e9edc9"/>
      <stop offset="90%" stop-color="#ccd5ae"/>
      <stop offset="100%" stop-color="#b08968"/>
    </linearGradient>
    <linearGradient id="batGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ball Gradients -->
    <radialGradient id="cricketBallRed" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="95%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="cricketGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" fill="url(#cricketBg)"/>

  <!-- Light Cone -->
  <polygon points="512,10 160,840 864,840" fill="url(#warmLight)"/>

  <!-- Ambient Glow -->
  <circle cx="512" cy="480" r="300" fill="#10b981" opacity="0.08" filter="url(#emeraldGlow)"/>
  <circle cx="512" cy="480" r="220" fill="#f59e0b" opacity="0.06" filter="url(#emeraldGlow)"/>

  <!-- Floating Dust Particles -->
  <circle cx="360" cy="220" r="4" fill="#fde047" opacity="0.45"/>
  <circle cx="640" cy="280" r="5" fill="#fde047" opacity="0.5"/>
  <circle cx="300" cy="480" r="3" fill="#fde047" opacity="0.3"/>
  <circle cx="720" cy="520" r="4" fill="#fde047" opacity="0.4"/>
  <circle cx="480" cy="160" r="3" fill="#fde047" opacity="0.6"/>

  <!-- Background Championship Shield -->
  <g transform="translate(512, 380)" opacity="0.35">
    <path d="M0,-160 L140,-110 L140,40 Q140,160 0,220 Q-140,160 -140,40 L-140,-110 Z" fill="none" stroke="url(#cricketGold)" stroke-width="4"/>
    <path d="M0,-140 L120,-95 L120,35 Q120,140 0,195 Q-120,140 -120,35 L-120,-95 Z" fill="#042f2e" opacity="0.4"/>
    <!-- Laurel Wreath in Shield -->
    <circle cx="0" cy="30" r="60" fill="none" stroke="url(#cricketGold)" stroke-width="2.5" stroke-dasharray="8,6"/>
    <!-- Crossed Bats Icon in Shield -->
    <line x1="-35" y1="-10" x2="35" y2="70" stroke="url(#cricketGold)" stroke-width="3"/>
    <line x1="35" y1="-10" x2="-35" y2="70" stroke="url(#cricketGold)" stroke-width="3"/>
  </g>

  <!-- Pedestal Platform & Velvet Cushion -->
  <ellipse cx="512" cy="840" rx="360" ry="70" fill="#020606" opacity="0.95"/>
  <!-- Base Wooden Plinth -->
  <polygon points="172,810 252,760 772,760 852,810 772,860 252,860" fill="#1c1917" stroke="url(#cricketGold)" stroke-width="1.5"/>
  <polygon points="172,810 852,810 852,830 772,880 252,880 172,830" fill="#0c0a09"/>
  <!-- Velvet Step -->
  <polygon points="232,770 292,735 732,735 792,770 732,805 292,805" fill="#064e3b" stroke="#059669" stroke-width="2"/>
  <!-- Specular Velvet Sheen -->
  <ellipse cx="512" cy="765" rx="220" ry="24" fill="#10b981" opacity="0.15"/>

  <!-- Plaque on Stand -->
  <g transform="translate(362, 815)">
    <rect width="300" height="46" rx="6" fill="#1e1b18" stroke="url(#cricketGold)" stroke-width="2"/>
    <text x="150" y="21" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="2">LOT #18 • HERITAGE MASTER</text>
    <text x="150" y="37" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.5">ENGLISH WILLOW &amp; TEST BALL</text>
  </g>

  <!-- ARTISANAL CRICKET BAT (Angled in Showcase Stand) -->
  <g transform="translate(430, 480) rotate(-22)">
    <!-- Bat Drop Shadow -->
    <rect x="-35" y="-310" width="80" height="520" rx="16" fill="#000000" opacity="0.45" filter="url(#emeraldGlow)"/>

    <!-- Handle -->
    <rect x="-10" y="-310" width="22" height="150" rx="9" fill="url(#batGrip)" stroke="#475569" stroke-width="1.5"/>
    <!-- Handle Twine Texture / Ribs -->
    <line x1="-10" y1="-285" x2="12" y2="-285" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-10" y1="-260" x2="12" y2="-260" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-10" y1="-235" x2="12" y2="-235" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-10" y1="-210" x2="12" y2="-210" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-10" y1="-185" x2="12" y2="-185" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Handle Top Cap -->
    <ellipse cx="1" cy="-310" rx="11" ry="5" fill="url(#cricketGold)"/>

    <!-- Handle Rubber / Cane Transition Wedge -->
    <polygon points="-12,-160 14,-160 8,-130 -6,-130" fill="#1e293b"/>

    <!-- Bat Shoulder & Blade -->
    <!-- Blade Body -->
    <path d="M-30,-130 C-32,-110 -38,-60 -38,100 L-38,200 C-38,212 -28,218 2,218 C32,218 42,212 42,200 L42,100 C42,-60 36,-110 34,-130 Z" fill="url(#willowWood)" stroke="#78350f" stroke-width="2.5"/>

    <!-- Spine Ridge Line (High Profile Shape) -->
    <line x1="2" y1="-110" x2="2" y2="195" stroke="#b08968" stroke-width="3" opacity="0.7"/>
    <!-- Willow Grains -->
    <line x1="-24" y1="-100" x2="-24" y2="185" stroke="#b08968" stroke-width="1" stroke-dasharray="35,15,50,20" opacity="0.6"/>
    <line x1="-12" y1="-105" x2="-12" y2="190" stroke="#b08968" stroke-width="1" stroke-dasharray="20,10,40,15" opacity="0.6"/>
    <line x1="16" y1="-105" x2="16" y2="190" stroke="#b08968" stroke-width="1" stroke-dasharray="45,15,30,10" opacity="0.6"/>
    <line x1="28" y1="-100" x2="28" y2="185" stroke="#b08968" stroke-width="1" stroke-dasharray="15,20,50,25" opacity="0.6"/>

    <!-- Commemorative Embossed Gold Insignia Band on Blade -->
    <rect x="-35" y="-40" width="74" height="70" rx="4" fill="#042f2e" stroke="url(#cricketGold)" stroke-width="2"/>
    <polygon points="2,-30 20, -5 12,20 -8,20 -16,-5" fill="none" stroke="url(#cricketGold)" stroke-width="1.5"/>
    <text x="2" y="-1" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="900" fill="#fef08a" text-anchor="middle">AX</text>
    <text x="2" y="16" font-family="'Inter', system-ui, sans-serif" font-size="7" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">LIMITED</text>

    <!-- Toe Guard Base -->
    <path d="M-38,198 C-38,212 -28,218 2,218 C32,218 42,212 42,198 L42,190 L-38,190 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- MATCH CRICKET BALL (Foreground Right) -->
  <g transform="translate(630, 670)">
    <!-- Ball Cast Shadow on Velvet -->
    <ellipse cx="10" cy="85" rx="80" ry="22" fill="#000000" opacity="0.75" filter="url(#emeraldGlow)"/>

    <!-- Ball Sphere -->
    <circle cx="0" cy="0" r="85" fill="url(#cricketBallRed)"/>

    <!-- 4-Piece Leather Seam Curved Arc -->
    <!-- Main Center Raised Seam -->
    <ellipse cx="0" cy="0" rx="85" ry="32" transform="rotate(-35)" fill="none" stroke="#fef08a" stroke-width="3"/>
    <!-- Hand Stitches Along Seam -->
    <ellipse cx="0" cy="0" rx="85" ry="32" transform="rotate(-35)" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="4,5"/>
    <!-- Quarter Quarter-Seam Stitch -->
    <path d="M-30,-75 Q0,-15 30,75" fill="none" stroke="#991b1b" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>

    <!-- Gold Foil Stamp on Leather Ball -->
    <g transform="translate(-15, -20) rotate(-15)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#cricketGold)" stroke-width="1.5"/>
      <text x="0" y="3" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="800" fill="#fef08a" text-anchor="middle">AX</text>
    </g>

    <!-- Specular Highlight -->
    <ellipse cx="-28" cy="-28" rx="22" ry="12" transform="rotate(-40, -28, -28)" fill="#ffffff" opacity="0.45" filter="url(#emeraldGlow)"/>
    <circle cx="-32" cy="-32" r="5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(64, 56)">
    <rect width="320" height="42" rx="21" fill="#042f2e" stroke="url(#cricketGold)" stroke-width="1.5" opacity="0.95"/>
    <circle cx="26" cy="21" r="5" fill="#10b981" filter="url(#emeraldGlow)"/>
    <text x="44" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="2">HISTORIC CRICKET COLLECTION</text>
  </g>

  <g transform="translate(680, 56)">
    <rect width="280" height="42" rx="8" fill="#041f1f" stroke="#059669" stroke-width="1" opacity="0.9"/>
    <text x="140" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1.5">AUCTIONX VAULT</text>
  </g>
</svg>
