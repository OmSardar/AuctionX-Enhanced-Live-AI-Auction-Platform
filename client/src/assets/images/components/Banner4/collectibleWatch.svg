<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="watchBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="50%" stop-color="#140c06"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="amberSpot" x1="50%" y1="0%" x2="50%" y2="85%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>

    <!-- Rose Gold / Luxury Metal Gradients -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="20%" stop-color="#fecdd3"/>
      <stop offset="45%" stop-color="#fb7185"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="90%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="warmGoldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Leather Strap Gradient -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="30%" stop-color="#292524"/>
      <stop offset="70%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>

    <!-- Dial Gradient -->
    <radialGradient id="dialInner" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="60%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" fill="url(#watchBg)"/>

  <!-- Spotlight Cone -->
  <polygon points="512,15 170,840 854,840" fill="url(#amberSpot)"/>

  <!-- Warm Atmospheric Glow -->
  <circle cx="512" cy="460" r="320" fill="#f97316" opacity="0.08" filter="url(#amberGlow)"/>
  <circle cx="512" cy="460" r="220" fill="#fbbf24" opacity="0.06" filter="url(#amberGlow)"/>

  <!-- Floating Golden Dust Bokeh -->
  <circle cx="340" cy="240" r="3.5" fill="#fed7aa" opacity="0.5"/>
  <circle cx="680" cy="210" r="4.5" fill="#fed7aa" opacity="0.55"/>
  <circle cx="280" cy="480" r="2.5" fill="#fed7aa" opacity="0.35"/>
  <circle cx="740" cy="500" r="4" fill="#fed7aa" opacity="0.45"/>
  <circle cx="430" cy="170" r="3" fill="#fed7aa" opacity="0.6"/>

  <!-- Pedestal Base Shadow -->
  <ellipse cx="512" cy="850" rx="350" ry="65" fill="#000000" opacity="0.95"/>

  <!-- Showcase Vitrine Platform -->
  <!-- Base Tier -->
  <polygon points="212,820 292,770 732,770 812,820 732,870 292,870" fill="#1c1917" stroke="url(#roseGold)" stroke-width="1.5"/>
  <polygon points="212,820 812,820 812,840 732,890 292,890 212,840" fill="#0c0a09"/>
  <!-- Velvet Showcase Top -->
  <polygon points="272,780 332,745 692,745 752,780 692,815 332,815" fill="#18181b" stroke="#f43f5e" stroke-width="1.5"/>
  <!-- Ambient Vitrine Rim Light -->
  <ellipse cx="512" cy="775" rx="190" ry="22" fill="#fb7185" opacity="0.12"/>

  <!-- Plaque on Showcase -->
  <g transform="translate(362, 815)">
    <rect width="300" height="46" rx="6" fill="#1c1917" stroke="url(#roseGold)" stroke-width="2"/>
    <text x="150" y="21" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffe4e6" text-anchor="middle" letter-spacing="2">LOT #24 • TOURBILLON MASTER</text>
    <text x="150" y="37" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#fda4af" text-anchor="middle" letter-spacing="1.5">SKELETON CHRONOGRAPH</text>
  </g>

  <!-- LUXURY TIMEPIECE (Central Showcase) -->
  <g id="luxuryTimepiece">
    <!-- Watch Leather Strap -->
    <!-- Top Strap -->
    <path d="M440,320 L448,150 L576,150 L584,320 Z" fill="url(#strapGrad)" stroke="#44403c" stroke-width="2"/>
    <!-- Top Strap Stitches -->
    <line x1="456" y1="160" x2="450" y2="310" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="568" y1="160" x2="574" y2="310" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Bottom Strap -->
    <path d="M440,600 L448,770 L576,770 L584,600 Z" fill="url(#strapGrad)" stroke="#44403c" stroke-width="2"/>
    <!-- Bottom Strap Stitches -->
    <line x1="450" y1="610" x2="456" y2="760" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="574" y1="610" x2="568" y2="760" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Watch Case Lugs -->
    <polygon points="420,330 445,300 455,340 426,380" fill="url(#roseGold)"/>
    <polygon points="604,330 579,300 569,340 598,380" fill="url(#roseGold)"/>
    <polygon points="420,590 445,620 455,580 426,540" fill="url(#roseGold)"/>
    <polygon points="604,590 579,620 569,580 598,540" fill="url(#roseGold)"/>

    <!-- Crown & Pushers (Right side) -->
    <!-- Main Knurled Crown -->
    <rect x="686" y="442" width="26" height="36" rx="4" fill="url(#roseGold)" stroke="#881337" stroke-width="1.5"/>
    <line x1="692" y1="444" x2="692" y2="476" stroke="#4c0519" stroke-width="1.5"/>
    <line x1="698" y1="444" x2="698" y2="476" stroke="#4c0519" stroke-width="1.5"/>
    <line x1="704" y1="444" x2="704" y2="476" stroke="#4c0519" stroke-width="1.5"/>
    <!-- Top Chrono Pusher -->
    <rect x="670" y="380" width="20" height="24" rx="3" transform="rotate(20, 670, 380)" fill="url(#roseGold)"/>
    <!-- Bottom Chrono Pusher -->
    <rect x="670" y="520" width="20" height="24" rx="3" transform="rotate(-20, 670, 520)" fill="url(#roseGold)"/>

    <!-- Outer Bezel Ring -->
    <circle cx="512" cy="460" r="185" fill="url(#roseGold)" stroke="#881337" stroke-width="3"/>
    <!-- Inner Stepped Bezel -->
    <circle cx="512" cy="460" r="165" fill="#1c1917" stroke="url(#roseGold)" stroke-width="2"/>

    <!-- Tachymeter Scale Ring -->
    <circle cx="512" cy="460" r="150" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="2,6"/>

    <!-- Dial Face (Dark Skeleton) -->
    <circle cx="512" cy="460" r="145" fill="url(#dialInner)"/>

    <!-- Skeleton Gearwork Mechanism -->
    <!-- Large Rhodium Wheel (Top-Right) -->
    <circle cx="545" cy="415" r="42" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="6,4" opacity="0.8"/>
    <circle cx="545" cy="415" r="18" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="545" cy="415" r="6" fill="#f43f5e"/>

    <!-- Golden Escapement Wheel (Bottom-Left) -->
    <circle cx="470" cy="505" r="36" fill="none" stroke="url(#warmGoldTrim)" stroke-width="3.5" stroke-dasharray="5,3"/>
    <circle cx="470" cy="505" r="14" fill="#1c1917" stroke="#eab308" stroke-width="2"/>
    <circle cx="470" cy="505" r="5" fill="#f43f5e"/>

    <!-- Connecting Bridge Plates -->
    <path d="M450,420 L570,420 L560,435 L460,435 Z" fill="url(#roseGold)" opacity="0.9"/>
    <path d="M470,490 L550,520 L545,535 L465,505 Z" fill="url(#roseGold)" opacity="0.9"/>

    <!-- Tourbillon Cage at 6 o'clock -->
    <circle cx="512" cy="530" r="28" fill="none" stroke="url(#roseGold)" stroke-width="2.5"/>
    <line x1="512" y1="504" x2="512" y2="556" stroke="#38bdf8" stroke-width="2"/>
    <line x1="486" y1="530" x2="538" y2="530" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="512" cy="530" r="8" fill="#e11d48"/>

    <!-- Chronograph Subdials -->
    <!-- Subdial at 9 o'clock (Seconds) -->
    <circle cx="430" cy="460" r="28" fill="#09090b" stroke="#f43f5e" stroke-width="1.5" opacity="0.9"/>
    <line x1="430" y1="460" x2="430" y2="440" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Subdial at 3 o'clock (30-Minute Counter) -->
    <circle cx="594" cy="460" r="28" fill="#09090b" stroke="#f43f5e" stroke-width="1.5" opacity="0.9"/>
    <line x1="594" y1="460" x2="610" y2="450" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Dial Hour Markers (Applied Rose Gold Batons) -->
    <rect x="509" y="325" width="6" height="22" rx="2" fill="url(#roseGold)"/> <!-- 12 -->
    <rect x="625" y="457" width="22" height="6" rx="2" fill="url(#roseGold)"/> <!-- 3 -->
    <rect x="375" y="457" width="22" height="6" rx="2" fill="url(#roseGold)"/> <!-- 9 -->

    <!-- Watch Hands (Blued Steel with Luminescent Infill) -->
    <!-- Hour Hand -->
    <polygon points="512,460 507,455 510,380 514,380 517,455" fill="#2563eb" stroke="#60a5fa" stroke-width="1"/>
    <!-- Minute Hand -->
    <polygon points="512,460 508,455 510,345 514,345 516,455" fill="#2563eb" stroke="#60a5fa" stroke-width="1"/>
    <!-- Central Chrono Second Hand (Needle) -->
    <line x1="512" y1="510" x2="512" y2="330" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="512" cy="460" r="7" fill="url(#roseGold)" stroke="#881337" stroke-width="1.5"/>

    <!-- Sapphire Crystal Curved Glint Reflection -->
    <path d="M400,380 C440,340 500,330 560,340 C490,360 440,410 410,470 Z" fill="#ffffff" opacity="0.18" filter="url(#amberGlow)"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(64, 56)">
    <rect width="320" height="42" rx="21" fill="#1c1917" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.95"/>
    <circle cx="26" cy="21" r="5" fill="#f43f5e" filter="url(#amberGlow)"/>
    <text x="44" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="2">HAUTE HORLOGERIE VAULT</text>
  </g>

  <g transform="translate(680, 56)">
    <rect width="280" height="42" rx="8" fill="#1c1917" stroke="#fb923c" stroke-width="1" opacity="0.9"/>
    <text x="140" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fdba74" text-anchor="middle" letter-spacing="1.5">AUCTIONX MASTERWORKS</text>
  </g>
</svg>
